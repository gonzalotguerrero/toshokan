services:
  # Single-node Cassandra for local development.
  # The official image ships with authentication disabled, so no username or password is needed.
  cassandra:
    image: cassandra:4.1
    container_name: toshokan-cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    # Start Cassandra normally, and in the background create the app's keyspace once CQL is reachable.
    command:
      - bash
      - -c
      - |
        (until cqlsh -e "CREATE KEYSPACE IF NOT EXISTS toshokan WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};" >/dev/null 2>&1; do sleep 5; done) &
        exec docker-entrypoint.sh cassandra -f
    volumes:
      - cassandra-data:/var/lib/cassandra
    # Healthy only once the keyspace exists, so the app never connects too early.
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACE toshokan"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  cassandra-data:
