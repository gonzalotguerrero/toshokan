services:
  # Single-node Cassandra for local development.
  # The official image has authentication turned off, so there's no username or password.
  cassandra:
    image: cassandra:4.1
    container_name: toshokan-cassandra
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    # Runs Cassandra as usual. Meanwhile, a background loop keeps trying to create the toshokan
    # keyspace until Cassandra starts accepting connections.
    command:
      - bash
      - -c
      - |
        (until cqlsh -e "CREATE KEYSPACE IF NOT EXISTS toshokan WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};" >/dev/null 2>&1; do sleep 5; done) &
        exec docker-entrypoint.sh cassandra -f
    volumes:
      - cassandra-data:/var/lib/cassandra
    # Only reports healthy once the keyspace exists, so the app can't connect before it's there.
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACE toshokan"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  cassandra-data:
