spring.application.name=toshokan

# Every URL starts with /toshokan, e.g. http://localhost:8080/toshokan/api/v1/books
server.servlet.context-path=/toshokan

# The API description and Swagger UI, generated by springdoc:
# http://localhost:8080/toshokan/v3/api-docs and http://localhost:8080/toshokan/swagger-ui.html
springdoc.paths-to-match=/api/**

# Show our own debug logs while developing locally. Everything else stays at INFO.
logging.level.io.github.gonzalotguerrero.toshokan=debug

# Due dates follow the library's calendar. Leave it empty to use the server's time zone.
toshokan.time-zone=

# Lending rules
toshokan.lending.loan-period=14d
toshokan.lending.max-renewals=2
toshokan.lending.max-active-loans=3

# Cassandra
spring.cassandra.contact-points=localhost:9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.keyspace-name=toshokan
spring.cassandra.schema-action=create-if-not-exists

# Starts compose.yaml together with the app. Spring looks for it in the working directory, which is
# the repo root both from IntelliJ and from mvn spring-boot:run (see toshokan-app/pom.xml).
spring.docker.compose.readiness.timeout=3m
