<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">toshokan</title>

  <!-- Contratapa -->
  <rect x="34" y="34" width="186" height="192" rx="12" fill="#1E3A8A"/>

  <!-- Páginas (se ven entre las tapas, a la derecha y abajo) -->
  <rect x="50" y="30" width="164" height="190" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <g stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round">
    <line x1="205" y1="40" x2="205" y2="212"/>
    <line x1="209" y1="40" x2="209" y2="212"/>
    <line x1="60" y1="214" x2="200" y2="214"/>
  </g>

  <!-- Tapa frontal -->
  <rect x="34" y="26" width="164" height="182" rx="12" fill="#2563EB"/>
  <!-- Lomo -->
  <path d="M46 26 H56 V226 H46 A12 12 0 0 1 34 214 V38 A12 12 0 0 1 46 26 Z" fill="#1D4ED8"/>
  <line x1="56" y1="26" x2="56" y2="208" stroke="#1E40AF" stroke-width="2"/>

  <!-- Kanji 本 trazado a mano (no depende de fuentes instaladas) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 82 H168"/>
    <path d="M127 58 V178"/>
    <path d="M124 86 Q110 124 80 148"/>
    <path d="M130 86 Q144 124 174 148"/>
    <path d="M106 150 H148"/>
